name: Update MetLife Stadium Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: metlife-stadium-calendar-update
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: |
          python -m py_compile fetch_events.py
          python -m py_compile generate_calendar.py

      - name: Fetch MetLife Stadium events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python fetch_events.py

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Validate calendar
        run: |
          test -s metlife-stadium-calendar.ics
          grep -q "^BEGIN:VCALENDAR" metlife-stadium-calendar.ics
          grep -q "^END:VCALENDAR" metlife-stadium-calendar.ics

      - name: Commit calendar if changed
        run: |
          if git diff --quiet -- metlife-stadium-calendar.ics && git ls-files --error-unmatch metlife-stadium-calendar.ics >/dev/null 2>&1; then
            echo "Calendar has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metlife-stadium-calendar.ics

          if git diff --cached --quiet; then
            echo "Calendar has not changed."
            exit 0
          fi

          git commit -m "Update calendar"
          git push
